name: Build Nova v73.3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Nova source ZIP
        run: |
          mkdir -p build-src
          unzip -q Nova_AI_MOBILE_GITHUB_STEP8_V810_QA_FIXED.zip -d build-src
          find build-src -maxdepth 2 -type f | head -50
      - name: Locate Android project
        run: |
          ROOT=$(find build-src -name settings.gradle.kts -o -name settings.gradle | head -1)
          test -n "$ROOT"
          echo "PROJECT_ROOT=$(dirname "$ROOT")" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-v73.3-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
