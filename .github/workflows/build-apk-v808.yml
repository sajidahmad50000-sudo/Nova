name: Build Nova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare Nova project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -iname 'Nova_AI_MOBILE_GITHUB_*.zip' \
              -print | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Nova project ZIP."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          rm -rf nova_project
          mkdir -p nova_project

          unzip -q "${ZIPS[0]}" -d nova_project

          if [ -f nova_project/settings.gradle.kts ] || [ -f nova_project/settings.gradle ]; then
            PROJECT_DIR="nova_project"
          else
            mapfile -t SETTINGS < <(
              find nova_project -mindepth 1 -maxdepth 3 \
                \( -name settings.gradle.kts -o -name settings.gradle \) \
                -print | sort
            )

            if [ "${#SETTINGS[@]}" -ne 1 ]; then
              echo "ERROR: Could not find exactly one Gradle settings file."
              printf '%s\n' "${SETTINGS[@]}"
              exit 1
            fi

            PROJECT_DIR="$(dirname "${SETTINGS[0]}")"
          fi

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Nova project prepared successfully"
          echo "ZIP: ${ZIPS[0]}"
          echo "PROJECT_DIR: ${PROJECT_DIR}"
          echo "================================"

      - name: Build Nova APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building with Gradle 8.11.1..."
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Step8-Android-Control-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Step8-build-reports
          path: |
            nova_project/**/build/reports/**
            nova_project/**/build/outputs/logs/**
          if-no-files-found: ignore
