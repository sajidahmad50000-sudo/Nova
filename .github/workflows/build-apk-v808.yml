name: Build Nova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare Nova project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -iname 'Nova_AI_MOBILE_GITHUB_*.zip' \
              -print | sort
          )

          echo "Nova ZIP files found:"
          printf '%s\n' "${ZIPS[@]}"

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Exactly ONE Nova project ZIP is required."
            exit 1
          fi

          rm -rf nova_project
          mkdir -p nova_project

          unzip -q "${ZIPS[0]}" -d nova_project

          if [ -f "nova_project/settings.gradle.kts" ]; then
            PROJECT_DIR="nova_project"
          else
            mapfile -t PROJECTS < <(
              find nova_project -mindepth 1 -maxdepth 2 \
                -type f -name 'settings.gradle.kts' \
                -printf '%h\n' | sort -u
            )

            if [ "${#PROJECTS[@]}" -ne 1 ]; then
              echo "ERROR: Could not locate exactly one Gradle project."
              find nova_project -maxdepth 3 -type f | sort
              exit 1
            fi

            PROJECT_DIR="${PROJECTS[0]}"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================="
          echo "Nova project: $PROJECT_DIR"
          echo "ZIP: ${ZIPS[0]}"
          echo "=============================="

      - name: Pre-build source QA
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nova/mobile/MainActivity.kt
          test -f app/src/main/java/com/nova/mobile/control/NovaAccessibilityService.kt

          grep -q '@Composable' \
            app/src/main/java/com/nova/mobile/MainActivity.kt

          if grep -R -n \
            'serviceInfo.*canPerformGestures' \
            app/src/main/java; then
            echo "ERROR: Invalid canPerformGestures reference found."
            exit 1
          fi

          grep -q 'CAPABILITY_CAN_PERFORM_GESTURES' \
            app/src/main/java/com/nova/mobile/control/NovaAccessibilityService.kt

          echo "Nova source QA PASSED."

      - name: Build Nova APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building with Gradle 8.11.1..."

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-Control-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-build-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: ignore
