name: Build Nova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find Nova Project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'Nova_AI_MOBILE_GITHUB_*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Nova ZIP not found"
            exit 1
          fi

          rm -rf nova_project
          mkdir -p nova_project
          unzip -q "$ZIP_FILE" -d nova_project

          if [ -f "nova_project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=nova_project" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find nova_project -name settings.gradle.kts -print -quit | xargs dirname)
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build Nova APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Check APK
        run: |
          test -f "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Nova APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
