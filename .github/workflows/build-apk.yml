name: Build Nova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find Nova project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          mapfile -t zips < <(
            find . -maxdepth 1 -type f \
            -iname 'Nova_AI_MOBILE_GITHUB_*.zip' \
            -print | sort
          )

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE Nova ZIP."
            echo "Found: ${#zips[@]}"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

          ZIP_FILE="${zips[0]}"

          rm -rf nova_project
          mkdir -p nova_project
          unzip -q "$ZIP_FILE" -d nova_project

          PROJECT_DIR="$(
            find nova_project \
            -mindepth 1 \
            -maxdepth 4 \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit |
            xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            find nova_project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build Nova APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Nova APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
