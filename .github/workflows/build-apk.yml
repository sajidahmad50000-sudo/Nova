name: Build Nova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f Nova_AI_MOBILE_GITHUB_v72_2_ONE_PACKAGE.zip

      - name: Extract Nova project
        run: |
          rm -rf nova_project
          unzip -q Nova_AI_MOBILE_GITHUB_v72_2_ONE_PACKAGE.zip
          mv Nova_AI_MOBILE_GITHUB_v72_2_ONE_PACKAGE nova_project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Build Nova APK
        working-directory: nova_project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          test -f nova_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh nova_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Nova APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-debug-APK
          path: nova_project/app/build/outputs/apk/debug/app-debug.apk
