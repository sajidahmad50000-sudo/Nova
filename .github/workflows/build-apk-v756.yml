name: Build Nova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Nova project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
            -iname 'Nova_AI_MOBILE_GITHUB_*.zip' \
            -print | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Nova project ZIP."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          rm -rf nova_project
          mkdir -p nova_project
          unzip -q "${ZIPS[0]}" -d nova_project

          PROJECT_DIR="nova_project"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Building ZIP: ${ZIPS[0]}"
          echo "Project: ${PROJECT_DIR}"
          echo "================================"

      - name: Build Nova APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-75.6-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
